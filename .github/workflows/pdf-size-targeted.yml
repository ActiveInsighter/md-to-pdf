name: PDF size targeted benchmark

on:
  push:
    branches:
      - test/pdf-size-optimization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefer-offline --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk poppler-utils qpdf
          fc-cache -f
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Prepare variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/targeted
          cat > themes/size-targeted.css <<'CSS'
          /* shared base.css only */
          CSS

          cp scripts/build-pdf.mjs scripts/build-pdf-no-tagged.bench.mjs
          perl -0pi -e 's/outline: true,/outline: true,\n      tagged: false,/' scripts/build-pdf-no-tagged.bench.mjs

          cp scripts/build-pdf.mjs scripts/build-pdf-no-outline.bench.mjs
          perl -0pi -e 's/outline: true,/outline: false,/' scripts/build-pdf-no-outline.bench.mjs

          cp scripts/build-pdf.mjs scripts/build-pdf-no-footer.bench.mjs
          perl -0pi -e 's/displayHeaderFooter: true,/displayHeaderFooter: false,/' scripts/build-pdf-no-footer.bench.mjs

          cp scripts/build-pdf.mjs scripts/build-pdf-latin-footer.bench.mjs
          perl -0pi -e 's/font-family:&quot;Aptos&quot;,[^;]+;/font-family:&quot;Liberation Sans&quot;, Arial, sans-serif;/' scripts/build-pdf-latin-footer.bench.mjs

          cp scripts/build-pdf-no-tagged.bench.mjs scripts/build-pdf-recommended.bench.mjs
          perl -0pi -e 's/font-family:&quot;Aptos&quot;,[^;]+;/font-family:&quot;Liberation Sans&quot;, Arial, sans-serif;/' scripts/build-pdf-recommended.bench.mjs

      - name: Render targeted variants
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-pdf.mjs notes.md dist/targeted/01-baseline.pdf --theme size-targeted
          node scripts/build-pdf-no-tagged.bench.mjs notes.md dist/targeted/02-no-tagged.pdf --theme size-targeted
          node scripts/build-pdf-no-outline.bench.mjs notes.md dist/targeted/03-no-outline.pdf --theme size-targeted
          node scripts/build-pdf-no-footer.bench.mjs notes.md dist/targeted/04-no-footer.pdf --theme size-targeted
          node scripts/build-pdf-latin-footer.bench.mjs notes.md dist/targeted/05-latin-footer.pdf --theme size-targeted
          node scripts/build-pdf-recommended.bench.mjs notes.md dist/targeted/06-no-tagged-latin-footer.pdf --theme size-targeted

          qpdf --object-streams=generate --recompress-flate --compression-level=9 \
            dist/targeted/01-baseline.pdf dist/targeted/07-baseline-qpdf.pdf
          qpdf --object-streams=generate --recompress-flate --compression-level=9 \
            dist/targeted/02-no-tagged.pdf dist/targeted/08-no-tagged-qpdf.pdf
          qpdf --object-streams=generate --recompress-flate --compression-level=9 \
            dist/targeted/06-no-tagged-latin-footer.pdf dist/targeted/09-recommended-qpdf.pdf

      - name: Report
        shell: bash
        run: |
          set -euo pipefail
          REPORT=dist/targeted/report.tsv
          printf 'variant\tbytes\tMiB\tpages\tfonts\n' > "$REPORT"
          for pdf in dist/targeted/*.pdf; do
            name="$(basename "$pdf" .pdf)"
            bytes="$(stat -c '%s' "$pdf")"
            mib="$(awk -v b="$bytes" 'BEGIN { printf "%.3f", b / 1048576 }')"
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2; exit}')"
            fonts="$(pdffonts "$pdf" | awk 'NR > 2 && NF {n++} END {print n+0}')"
            printf '%s\t%s\t%s\t%s\t%s\n' "$name" "$bytes" "$mib" "$pages" "$fonts" >> "$REPORT"
            pdffonts "$pdf" > "dist/targeted/${name}-fonts.txt"
          done
          cat "$REPORT"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdf-size-targeted-${{ github.run_id }}
          path: dist/targeted
          if-no-files-found: error
          retention-days: 7
