name: PDF size benchmark

on:
  push:
    branches:
      - test/pdf-size-optimization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-size-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        shell: bash
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install PDF diagnostics and CJK fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-cjk \
            ghostscript \
            poppler-utils \
            qpdf
          fc-cache -f
          echo "Resolved CJK font: $(fc-match -f '%{family}\n' 'Noto Sans CJK SC' | head -n1)"

      - name: Resolve Chrome executable
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Prepare renderer variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/size-benchmark scripts/.pdf-size-benchmark

          cat > themes/size-benchmark.css <<'CSS'
          /* Intentionally empty. The shared base.css remains the baseline. */
          CSS

          cp scripts/build-pdf.mjs scripts/.pdf-size-benchmark/no-accessibility.mjs
          perl -0pi -e 's/outline: true,/outline: false,\n      tagged: false,/' scripts/.pdf-size-benchmark/no-accessibility.mjs

          cp scripts/build-pdf.mjs scripts/.pdf-size-benchmark/katex-html.mjs
          perl -0pi -e "s/output: 'htmlAndMathml'/output: 'html'/g" scripts/.pdf-size-benchmark/katex-html.mjs

          cp scripts/build-pdf.mjs scripts/.pdf-size-benchmark/combined.mjs
          perl -0pi -e 's/outline: true,/outline: false,\n      tagged: false,/' scripts/.pdf-size-benchmark/combined.mjs
          perl -0pi -e "s/output: 'htmlAndMathml'/output: 'html'/g" scripts/.pdf-size-benchmark/combined.mjs
          perl -0pi -e 's/font-weight:500/font-weight:400/g' scripts/.pdf-size-benchmark/combined.mjs

      - name: Render baseline and structural variants
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-pdf.mjs notes.md dist/size-benchmark/01-baseline.pdf --theme size-benchmark
          node scripts/.pdf-size-benchmark/no-accessibility.mjs notes.md dist/size-benchmark/02-no-tagged-outline.pdf --theme size-benchmark
          node scripts/.pdf-size-benchmark/katex-html.mjs notes.md dist/size-benchmark/03-katex-html-only.pdf --theme size-benchmark

      - name: Render compact-font and combined variants
        shell: bash
        run: |
          set -euo pipefail
          cp themes/base.css themes/base.css.benchmark-original
          perl -0pi -e 's/font-weight:\s*500\b/font-weight: 400/g; s/font-weight:\s*(?:600|620|650|680|700|720|760|800)\b/font-weight: 700/g' themes/base.css

          node scripts/build-pdf.mjs notes.md dist/size-benchmark/04-compact-font-weights.pdf --theme size-benchmark
          node scripts/.pdf-size-benchmark/combined.mjs notes.md dist/size-benchmark/05-combined.pdf --theme size-benchmark

          mv themes/base.css.benchmark-original themes/base.css

      - name: Post-process combined PDF
        shell: bash
        run: |
          set -euo pipefail
          qpdf \
            --object-streams=generate \
            --recompress-flate \
            --compression-level=9 \
            dist/size-benchmark/05-combined.pdf \
            dist/size-benchmark/06-qpdf-lossless.pdf

          qpdf \
            --object-streams=generate \
            --recompress-flate \
            --compression-level=9 \
            --optimize-images \
            --jpeg-quality=85 \
            dist/size-benchmark/05-combined.pdf \
            dist/size-benchmark/07-qpdf-image-opt.pdf

          gs \
            -sDEVICE=pdfwrite \
            -dCompatibilityLevel=1.7 \
            -dNOPAUSE -dQUIET -dBATCH \
            -dDetectDuplicateImages=true \
            -sOutputFile=dist/size-benchmark/08-ghostscript-default.pdf \
            dist/size-benchmark/05-combined.pdf

          gs \
            -sDEVICE=pdfwrite \
            -dCompatibilityLevel=1.7 \
            -dPDFSETTINGS=/ebook \
            -dNOPAUSE -dQUIET -dBATCH \
            -dDetectDuplicateImages=true \
            -sOutputFile=dist/size-benchmark/09-ghostscript-ebook.pdf \
            dist/size-benchmark/05-combined.pdf

      - name: Collect size and resource metrics
        shell: bash
        run: |
          set -euo pipefail
          REPORT=dist/size-benchmark/report.tsv
          printf 'variant\tbytes\tMiB\tpages\tfonts\timages\n' > "$REPORT"

          for pdf in dist/size-benchmark/*.pdf; do
            name="$(basename "$pdf" .pdf)"
            bytes="$(stat -c '%s' "$pdf")"
            mib="$(awk -v b="$bytes" 'BEGIN { printf "%.3f", b / 1048576 }')"
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2; exit}')"
            fonts="$(pdffonts "$pdf" | awk 'NR > 2 && NF {n++} END {print n+0}')"
            images="$(pdfimages -list "$pdf" | awk 'NR > 2 && NF {n++} END {print n+0}')"
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$name" "$bytes" "$mib" "$pages" "$fonts" "$images" >> "$REPORT"
            pdffonts "$pdf" > "dist/size-benchmark/${name}-fonts.txt"
            pdfimages -list "$pdf" > "dist/size-benchmark/${name}-images.txt"
            pdfinfo "$pdf" > "dist/size-benchmark/${name}-pdfinfo.txt"
          done

          baseline="$(awk -F '\t' '$1=="01-baseline" {print $2}' "$REPORT")"
          {
            echo
            echo -e 'variant\treduction_vs_baseline'
            tail -n +2 "$REPORT" | while IFS=$'\t' read -r name bytes mib pages fonts images; do
              reduction="$(awk -v b="$baseline" -v n="$bytes" 'BEGIN { printf "%.2f%%", (b-n)*100/b }')"
              printf '%s\t%s\n' "$name" "$reduction"
            done
          } >> "$REPORT"

          cat "$REPORT"

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdf-size-benchmark-${{ github.run_id }}
          path: dist/size-benchmark
          if-no-files-found: error
          retention-days: 7
